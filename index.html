
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campus Competition Registration Manager</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="brandmark">CC</div>
    <span>Campus Competitions</span>
  </div>

  <div class="top-actions">
    <span class="profile-chip" id="userLabel">
      Explore campus opportunities
    </span>

    <button class="btn outline small" id="topLogin" onclick="showLogin()">Login</button>
    <button class="btn primary small hidden" id="topDashboard" onclick="goDashboard()">Dashboard</button>
    <button class="btn outline small hidden" id="topLogout" onclick="logout()">Logout</button>
  </div>
</header>

<main id="app"></main>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<footer class="footer">
  Campus Competition Registration Manager · Student project demo
</footer>

<script src="script.js"></script>
</body>
</html>
